# Deploys the leaderboard worker (worker/**) to Cloudflare.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — token from the "Edit Cloudflare Workers" template, plus Account → D1 → Edit
#   CLOUDFLARE_ACCOUNT_ID — dash.cloudflare.com → Workers & Pages → Account ID
# Without them the job is skipped and says what is missing. After the first deploy, put the
# printed workers.dev address into LEADERBOARD_URL in src/daily.js.
name: Deploy leaderboard

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secrets present?
        id: s
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "ok=no" >> "$GITHUB_OUTPUT"
            echo "### Skipped: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Settings → Secrets → Actions." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ok=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Check the token (valid? right account? Workers + D1 allowed?)
        if: steps.s.outputs.ok == 'yes'
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api() { curl -s -o /tmp/r.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "https://api.cloudflare.com/client/v4$1"; }
          v=$(api /user/tokens/verify); tok=$(python3 -c "import json; d=json.load(open('/tmp/r.json')); print(d.get('result',{}).get('status','?'))")
          a=$(api "/accounts/$ACCOUNT"); w=$(api "/accounts/$ACCOUNT/workers/scripts"); d=$(api "/accounts/$ACCOUNT/d1/database")
          {
            echo "### Cloudflare token check"
            echo "- token valid: HTTP $v, status $tok"
            echo "- account ID reachable: HTTP $a (length ${#ACCOUNT})"
            echo "- Workers permission: HTTP $w"
            echo "- D1 permission: HTTP $d"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        if: steps.s.outputs.ok == 'yes'
        with:
          node-version: '20'
      - name: Create the database if needed and deploy
        if: steps.s.outputs.ok == 'yes'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          id=$(npx --yes wrangler@3 d1 list --json | python3 -c "import json,sys; print(next((d['uuid'] for d in json.load(sys.stdin) if d['name']=='serpentline-db'), ''))")
          if [ -z "$id" ]; then
            npx --yes wrangler@3 d1 create serpentline-db
            id=$(npx --yes wrangler@3 d1 list --json | python3 -c "import json,sys; print(next(d['uuid'] for d in json.load(sys.stdin) if d['name']=='serpentline-db'))")
          fi
          sed -i "s/__DATABASE_ID__/$id/" wrangler.toml
          npx --yes wrangler@3 deploy | tee deploy.log
          grep -o 'https://[^ ]*workers.dev' deploy.log | head -1 | sed 's/^/### Leaderboard URL: /' >> "$GITHUB_STEP_SUMMARY"
